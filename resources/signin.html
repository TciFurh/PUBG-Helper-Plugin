<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #000000;
    width: 1320px;
    padding: 40px;
  }
  .card {
    width: 1240px;
    background: #121212;
    border: 1px solid #262626;
    border-radius: 32px;
    padding: 44px;
    text-align: center;
  }
  .title { font-size: 32px; font-weight: 700; color: #ffffff; letter-spacing: 2px; margin-bottom: 34px; }
  .status {
    font-size: 42px;
    font-weight: 700;
    color: {{ color }};
    padding: 30px 40px;
    border: 1px solid #262626;
    border-radius: 20px;
    background: #1a1a1a;
    margin-bottom: 26px;
  }
  .role { font-size: 24px; color: #b8b8b8; margin-bottom: 10px; }
  .meta { font-size: 22px; color: #8a8a8a; }
</style>
</head>
<body>
<div class="card">
  <div class="title">每日签到</div>
  <div class="status">{{ status }}</div>
  <div class="role">{{ roleName }} · {{ roleId }}</div>
  <div class="meta">{{ date }}</div>
</div>
</body>
</html>
