<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #000000;
    width: 1320px;
    padding: 40px;
  }
  .card {
    width: 1240px;
    background: #121212;
    border: 1px solid #262626;
    border-radius: 32px;
    padding: 40px 44px;
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 28px;
    border-bottom: 1px solid #262626;
    margin-bottom: 28px;
  }
  .title { font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: 2px; }
  .sub { font-size: 22px; color: #8a8a8a; }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
  }
  .cell {
    background: #1a1a1a;
    border: 1px solid #242424;
    border-radius: 20px;
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cell img {
    width: 100%;
    height: 156px;
    object-fit: contain;
  }
  .cell .n {
    margin-top: 12px;
    font-size: 20px;
    font-weight: 700;
    color: #a8a8a8;
  }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title">王牌印记 · 图鉴</span>
    <span class="sub">共 {{ total }} 款 · {{ updated }} · 遍历至失效</span>
  </div>
  <div class="grid">
    {{ each list as it }}
    <div class="cell">
      <img src="{{ it.url }}" />
      <div class="n">#{{ it.n }}</div>
    </div>
    {{ /each }}
  </div>
</div>
</body>
</html>
