<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-50 p-8">
    <div class="mx-auto max-w-6xl">
        <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.highestDivUrl}}" class="w-full h-auto object-cover">
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-1">历史最高/王牌次数{{data.wangpaiLevel}}</h3>
                <p class="text-sm text-gray-600">{{data.highestDivName}}</p>
            </div>

            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.likeIcon}}" class="w-full h-auto object-cover">
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-1">队友点赞</h3>
                <p class="text-sm text-gray-600">{{data.likeTimes}}</p>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.wangpaiIcon}}" class="w-full h-auto object-cover">
                </div>
                <h3 class="text-base font-semibold text-gray-900 mb-1">王牌印记</h3>
                <p class="text-xs text-gray-600">{{data.wangpaiLevelName}}</p>
            </div>

            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.zywpIcon}}"
                        class="w-full h-auto object-cover">
                </div>
                <h3 class="text-base font-semibold text-gray-900 mb-1">卓越印记</h3>
                <p class="text-xs text-gray-600">{{data.zywpTimes}}次</p>
            </div>

            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.cqwpIcon}}"
                        class="w-full h-auto object-cover">
                </div>
                <h3 class="text-base font-semibold text-gray-900 mb-1">传奇印记</h3>
                <p class="text-xs text-gray-600">{{data.cqwpTimes}}次</p>
            </div>

            <div class="flex flex-col">
                <div class="overflow-hidden rounded-lg bg-gray-200 mb-3">
                    <img src="{{data.jswpIcon}}"
                        class="w-full h-auto object-cover">
                </div>
                <h3 class="text-base font-semibold text-gray-900 mb-1">绝世印记</h3>
                <p class="text-xs text-gray-600">{{data.jswpTimes}}次</p>
            </div>
        </div>
    </div>
</body>
