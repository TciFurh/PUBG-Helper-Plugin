<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和平营地 · QQ扫码登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #16161f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 420px;
            background: linear-gradient(180deg, #1e1e2a 0%, #181822 100%);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 28px 30px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            font-size: 13px;
            color: #9a9ab5;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 14px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f0f0f7;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 13px;
            color: #9a9ab5;
            margin-bottom: 24px;
        }
        .qr-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .tip {
            font-size: 14px;
            color: #e8e8f2;
            margin-bottom: 6px;
        }
        .hint {
            font-size: 12px;
            color: #7d7d99;
            line-height: 1.7;
        }
        .uuid {
            font-size: 11px;
            color: #56566e;
            margin-top: 14px;
            word-break: break-all;
            font-family: 'SF Mono', Consolas, monospace;
        }
        .footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: #5c5c78;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">{{appName}}</div>
        <h1>QQ扫码登录</h1>
        <div class="sub">请使用手机 QQ「扫一扫」授权登录</div>
        <div class="qr-box">
            <img src="data:image/png;base64,{{qrcodeBase64}}" alt="QQ登录二维码">
        </div>
        <div class="tip">二维码有效期 {{expiresInMin}} 分钟</div>
        <div class="hint">扫码后在手机上点击「确认登录」<br>凭证将自动保存，仅机器人主人可发起</div>
        <div class="uuid">{{uuid}}</div>
        <div class="footer">和平营地 · QQ官方扫码通道</div>
    </div>
</body>
</html>
