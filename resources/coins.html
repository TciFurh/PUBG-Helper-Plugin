<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>营地资产</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; zoom: 2.0;
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #000; color: #fafafa; padding: 26px 28px;
  }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .head .logo {
    width: 40px; height: 40px; border-radius: 10px; background: #1a1a1a;
    border: 1px solid #262626; display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .head .title { font-size: 20px; font-weight: 700; }
  .head .sub { font-size: 11px; color: #737373; margin-top: 2px; }
  .head .spacer { flex: 1; }
  .head .tag {
    font-size: 12px; font-weight: 600; color: #d4d4d4; background: #1a1a1a;
    border: 1px solid #2e2e2e; border-radius: 999px; padding: 5px 14px;
  }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .coin {
    background: #121212; border: 1px solid #262626; border-radius: 18px; padding: 20px 18px;
    position: relative; overflow: hidden;
  }
  .coin::after {
    content: ''; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px;
    border-radius: 50%; background: #ffffff06;
  }
  .coin .badge {
    width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; background: #1c1c1c; border: 1px solid #2a2a2a; color: #d4d4d4;
  }
  .coin.main .badge { background: #2a2210; border-color: #4a3a12; color: #fbbf24; }
  .coin .nm { font-size: 12px; color: #8e8e8e; margin-top: 12px; }
  .coin .num { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px; line-height: 1.1; }
  .coin.main .num { color: #fbbf24; }

  .foot { margin-top: 16px; background: #0d0d0d; border: 1px dashed #2a2a2a; border-radius: 14px; padding: 14px 18px; }
  .foot .l { font-size: 11.5px; color: #8e8e8e; line-height: 1.9; }
  .foot .l b { color: #d4d4d4; font-weight: 600; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">💰</div>
    <div>
      <div class="title">营地资产</div>
      <div class="sub">{{ roleName }} · {{ roleId }}</div>
    </div>
    <div class="spacer"></div>
    <div class="tag">{{ date }}</div>
  </div>

  <div class="grid">
    {{ each coins c }}
    <div class="coin {{ if c.main }}main{{ /if }}">
      <div class="badge">{{ c.initial }}</div>
      <div class="nm">{{ c.name }}</div>
      <div class="num">{{ c.numFmt }}</div>
    </div>
    {{ /each }}
  </div>

  <div class="foot">
    <div class="l">
      共 <b>{{ coins.length }}</b> 种货币 · 福利币可通过 <b>#和平签到</b> 和 <b>#和平任务</b> 获取<br>
      兑换入口：营地 App → 福利中心 → 兑换商城
    </div>
  </div>
</body>
</html>
