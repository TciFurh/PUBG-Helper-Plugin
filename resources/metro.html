<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #000000;
    width: 1080px;
    padding: 40px;
    color: #fafafa;
  }
  .card {
    width: 1000px;
    background: #121212;
    border: 1px solid #262626;
    border-radius: 28px;
    padding: 40px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
  .title { font-size: 34px; font-weight: 800; color: #ffffff; letter-spacing: 2px; }
  .season {
    font-size: 18px; color: #a8a8a8; background: #1a1a1a;
    border: 1px solid #333; border-radius: 12px; padding: 6px 16px;
  }
  .role { font-size: 20px; color: #8a8a8a; margin-bottom: 26px; }

  .tier-box {
    display: flex; align-items: center; gap: 18px;
    background: #1a1a1a; border: 1px solid #262626; border-radius: 18px;
    padding: 20px 24px; margin-bottom: 26px;
  }
  .tier-icon { width: 84px; height: 84px; object-fit: contain; filter: grayscale(20%) contrast(1.05); }
  .tier-info { flex: 1; }
  .tier-name { font-size: 30px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
  .tier-progress { font-size: 16px; color: #8a8a8a; margin-bottom: 10px; }
  .bar { height: 10px; background: #2a2a2a; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #4a4a4a, #8e8e8e); border-radius: 999px; width: {{ featPercent }}%; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px;
  }
  .stat {
    background: #161616; border: 1px solid #262626; border-radius: 16px;
    padding: 18px 16px; text-align: center;
  }
  .stat .k { font-size: 14px; color: #8a8a8a; margin-bottom: 8px; }
  .stat .v { font-size: 24px; font-weight: 700; color: #ffffff; }
  .stat .v.gray { color: #b8b8b8; }

  .sub-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .sub {
    background: #141414; border: 1px solid #2a2a2a; border-radius: 14px;
    padding: 14px 12px; text-align: center;
  }
  .sub .k { font-size: 13px; color: #8a8a8a; margin-bottom: 6px; }
  .sub .v { font-size: 19px; font-weight: 600; color: #d4d4d4; }

  .foot { margin-top: 24px; font-size: 15px; color: #6a6a6a; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="title">地铁逃生</div>
    <div class="season">{{ seasonName }} · S{{ seasonId }}</div>
  </div>
  <div class="role">{{ roleName }}</div>

  <div class="tier-box">
    <img class="tier-icon" src="{{ divIcon }}" alt="段位" />
    <div class="tier-info">
      <div class="tier-name">{{ divName }}</div>
      <div class="tier-progress">功勋值 {{ featText }}</div>
      <div class="bar"><div></div></div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="k">场数</div><div class="v">{{ matches }}</div></div>
    <div class="stat"><div class="k">K/D</div><div class="v gray">{{ kd }}</div></div>
    <div class="stat"><div class="k">单局最高收益</div><div class="v">{{ maxIncome }}</div></div>
    <div class="stat"><div class="k">赛季总收益</div><div class="v">{{ totalIncome }}</div></div>
  </div>

  <div class="sub-grid">
    <div class="sub"><div class="k">撤离率</div><div class="v">{{ escapeRate }}</div></div>
    <div class="sub"><div class="k">淘汰玩家</div><div class="v">{{ playerKills }}</div></div>
    <div class="sub"><div class="k">淘汰匪徒</div><div class="v">{{ banditKills }}</div></div>
    <div class="sub"><div class="k">淘汰怪物</div><div class="v">{{ monsterKills }}</div></div>
  </div>

  <div class="foot">更新于 {{ updated }}</div>
</div>
</body>
</html>
