<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战绩总览</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 900px;
      zoom: 2.0;
      font-family: 'Noto Sans SC', sans-serif;
      background: #000000;
      color: #fafafa;
      padding: 28px 30px;
    }
    .head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .head .logo {
      width: 44px; height: 44px; border-radius: 10px;
      background: #1a1a1a; border: 1px solid #262626;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    .head .title { font-size: 30px; font-weight: 700; }
    .head .sub { font-size: 16px; color: #737373; margin-top: 2px; }
    .head .spacer { flex: 1; }

    .row {
      display: flex; align-items: center; gap: 12px;
      background: #121212; border: 1px solid #262626; border-radius: 12px;
      padding: 13px 16px; margin-bottom: 8px;
    }
    .row .name { width: 90px; font-size: 20px; font-weight: 700; }
    .row .count { font-size: 28px; font-weight: 700; min-width: 40px; text-align: center; }
    .row .clabel { font-size: 14px; color: #8e8e8e; text-align: center; }
    .row .desc { flex: 1; min-width: 0; font-size: 16px; color: #a8a8a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .desc .t { font-size: 16px; font-weight: 600; color: #c8c8c8; }
    .row .desc .d { font-size: 15px; color: #737373; margin-top: 2px; }
    .row.more { border-color: #333; }
    .row.more .count { color: #e0e0e0; }

    .hint { font-size: 16px; color: #737373; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">▦</div>
    <div>
      <div class="title">战绩总览</div>
      <div class="sub">BATTLE OVERVIEW · {{roleName}}</div>
    </div>
    <div class="spacer"></div>
  </div>

  {{ each tabs as t }}
  <div class="row {{ if t.hasMore }}more{{ /if }}">
    <div class="name">{{t.name}}</div>
    <div>
      <div class="count">{{t.count}}</div>
      <div class="clabel">本页</div>
    </div>
    <div class="desc">
      <div class="t">{{t.recentDesc}}</div>
      <div class="d">最近 · {{t.recentTime}}</div>
    </div>
  </div>
  {{ /each }}

  <div class="hint">发送「#和平战绩 排位 / 地铁 / 古墓 / 团竞 / 巅峰赛 / 全民赛场 / 绿洲 / 匹配 / 内鬼」查看对应分类，可加页码如「#和平战绩 地铁 2」</div>
</body>
</html>
